# Render de una producción completa de AGUA STUDIO, en segmentos paralelos.
#
# Cómo lanzarlo desde el iPhone:
#   App de GitHub o Safari → repositorio → Actions → «AGUA STUDIO · Producción»
#   → Run workflow → (dejar los valores por defecto) → Run workflow.
#
# Qué hace:
#   1. preparar: verifica que los tiempos del guion estén actualizados y arma
#      un segmento por escena (con su rango de fotogramas).
#   2. render: renderiza cada segmento en paralelo (sin audio).
#   3. unir: genera la banda sonora sintetizada, une los segmentos con FFmpeg
#      sin recomprimir, agrega el audio normalizado (-14 LUFS), verifica el
#      archivo final y lo publica en la Release «produccion-<id>».
#
# No usa servicios pagos ni claves: solo el GITHUB_TOKEN automático.

name: "AGUA STUDIO · Producción"

on:
  workflow_dispatch:
    inputs:
      produccion:
        description: "Carpeta de la producción (dentro de producciones/)"
        required: true
        default: "001-agua"
      composicion:
        description: "Composición de Remotion"
        required: true
        default: "Produccion001"
      escala:
        description: "Escala del render (1 = 1080×1920)"
        required: true
        default: "1"
      tiempos:
        description: "Archivo de tiempos (tiempos.json o tiempos-narrada.json)"
        required: true
        default: "tiempos.json"
      sonido:
        description: "Hoja de sonido (sonido.json o sonido-narrada.json)"
        required: true
        default: "sonido.json"
      voz:
        description: "Narración completa dentro de la carpeta (vacío = sin voz)"
        required: false
        default: ""
      etiqueta:
        description: "Release donde publicar (vacío = produccion-<carpeta>)"
        required: false
        default: ""
      adjuntos:
        description: "Archivos extra para la Release, separados por espacios (rutas del repo)"
        required: false
        default: ""

permissions:
  contents: write

# Una sola ejecución por producción: si se lanza otra, la anterior se cancela.
concurrency:
  group: produccion-${{ inputs.produccion }}-${{ inputs.tiempos }}
  cancel-in-progress: true

env:
  PRODUCCION: ${{ inputs.produccion }}
  COMPOSICION: ${{ inputs.composicion }}
  ESCALA: ${{ inputs.escala }}
  TIEMPOS: ${{ inputs.tiempos }}
  SONIDO: ${{ inputs.sonido }}
  VOZ: ${{ inputs.voz }}
  ETIQUETA: ${{ inputs.etiqueta != '' && inputs.etiqueta || format('produccion-{0}', inputs.produccion) }}
  ADJUNTOS: ${{ inputs.adjuntos }}

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      segmentos: ${{ steps.segmentos.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar que los tiempos coinciden con el guion o la voz
        run: |
          if [ "$TIEMPOS" = "tiempos-narrada.json" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
            node scripts/alinear-voz.mjs "producciones/$PRODUCCION"
          elif [ -f "producciones/$PRODUCCION/guion.json" ]; then
            node scripts/temporizar.mjs "producciones/$PRODUCCION"
          else
            echo "Tiempos tomados de la voz grabada (se generan fuera de GitHub); no se recalculan."
          fi
          if [ "$TIEMPOS" = "tiempos-narrada.json" ]; then
            git diff --quiet "producciones/$PRODUCCION" || echo "::warning::La alineación recalculada en GitHub difiere levemente; se usa la versión del repositorio."
            git checkout -- "producciones/$PRODUCCION"
          else
            git diff --exit-code "producciones/$PRODUCCION" || (echo "::error::$TIEMPOS desactualizado: regenerarlo y subir el resultado" && exit 1)
          fi
      - name: Armar segmentos (hasta 300 fotogramas cada uno)
        id: segmentos
        run: |
          lista=$(node -e '
            const t = require("./producciones/" + process.env.PRODUCCION + "/" + process.env.TIEMPOS);
            const s = [];
            for (let d = 0, k = 1; d < t.frames; d += 300, k++) s.push({ id: "s" + String(k).padStart(2, "0"), desde: d, hasta: Math.min(t.frames, d + 300) - 1 });
            if (s.at(-1).hasta + 1 !== t.frames) { console.error("Los segmentos no cubren el video"); process.exit(1); }
            console.log(JSON.stringify(s));')
          echo "lista=$lista" >> "$GITHUB_OUTPUT"
          echo "### Segmentos" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$lista\`" >> "$GITHUB_STEP_SUMMARY"

  render:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        segmento: ${{ fromJSON(needs.preparar.outputs.segmentos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx remotion browser ensure
      - name: Renderizar ${{ matrix.segmento.id }} (fotogramas ${{ matrix.segmento.desde }}–${{ matrix.segmento.hasta }})
        run: |
          npx remotion render src/index.ts "$COMPOSICION" "out/${{ matrix.segmento.id }}.mp4" \
            --frames=${{ matrix.segmento.desde }}-${{ matrix.segmento.hasta }} --muted --scale="$ESCALA"
      - uses: actions/upload-artifact@v4
        with:
          name: segmento-${{ matrix.segmento.id }}
          path: out/${{ matrix.segmento.id }}.mp4
          retention-days: 7

  unir:
    needs: [preparar, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg y numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick
          python3 -m pip install --quiet numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: segmento-*
          path: out/segmentos
          merge-multiple: true
      - name: Banda sonora (sintetizada, sin samples) y mezcla con la voz
        run: |
          extra=""
          if [ -n "$VOZ" ]; then extra="--voz $VOZ"; fi
          if grep -q '"motor": "epico"' "producciones/$PRODUCCION/$SONIDO" 2>/dev/null; then
            python3 scripts/audio/epico.py "producciones/$PRODUCCION" --tiempos "$TIEMPOS" --salida mezcla-final.wav $extra
          else
            python3 scripts/audio/sintetizar.py "producciones/$PRODUCCION" --tiempos "$TIEMPOS" --sonido "$SONIDO" --salida mezcla-final.wav $extra
          fi
      - name: Unir segmentos y agregar audio
        run: |
          echo '${{ needs.preparar.outputs.segmentos }}' | jq -r '.[] | "file segmentos/\(.id).mp4"' > out/lista.txt
          cat out/lista.txt
          ffmpeg -v error -y -f concat -safe 0 -i out/lista.txt -c copy out/video-mudo.mp4
          ffmpeg -v error -y -i out/video-mudo.mp4 -i "producciones/$PRODUCCION/audio/mezcla-final.wav" \
            -map 0:v -map 1:a -c:v copy \
            -af "loudnorm=I=-14:TP=-1.5:LRA=11,aresample=48000" -c:a aac -b:a 192k \
            -shortest -movflags +faststart "out/$PRODUCCION.mp4"
      - name: Verificar el MP4 final
        run: node scripts/verificar-video.mjs "out/$PRODUCCION.mp4" "producciones/$PRODUCCION/$TIEMPOS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Portada y hoja de contacto por escena
        run: |
          node -e '
            const t = require("./producciones/" + process.env.PRODUCCION + "/" + process.env.TIEMPOS);
            let es = t.escenas;
            if (!es) {
              const actos = {};
              for (const f of t.frases) (actos[f.acto] ??= []).push(f);
              es = Object.entries(actos).map(([id, fs]) => ({ id, inicio: fs[0].inicio, duracion: fs.at(-1).fin - fs[0].inicio }));
            }
            for (const e of es) console.log(e.id, ((e.inicio + e.duracion * 0.6)).toFixed(2));
          ' | while read id seg; do
            ffmpeg -v error -y -ss "$seg" -i "out/$PRODUCCION.mp4" -frames:v 1 -vf scale=360:-1 "out/hoja-$id.jpg"
          done
          montage out/hoja-*.jpg -tile 8x1 -geometry +4+4 -background '#111' "out/$PRODUCCION-escenas.jpg"
          ffmpeg -v error -y -ss 4 -i "out/$PRODUCCION.mp4" -frames:v 1 "out/$PRODUCCION-portada.jpg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCCION }}-final
          path: |
            out/${{ env.PRODUCCION }}.mp4
            out/${{ env.PRODUCCION }}-escenas.jpg
          retention-days: 30
      - name: Publicar en la Release «${{ env.ETIQUETA }}»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="$ETIQUETA"
          gh release delete "$etiqueta" --yes --cleanup-tag || true
          srt="subtitulos.srt"
          if [ "$TIEMPOS" = "tiempos-narrada.json" ]; then srt="subtitulos-narrada.srt"; fi
          cp "producciones/$PRODUCCION/$srt" "out/$PRODUCCION-subtitulos.srt"
          extra=""
          if [ -f "producciones/$PRODUCCION/guia-locucion.md" ] && [ -z "$VOZ" ]; then cp "producciones/$PRODUCCION/guia-locucion.md" "out/$PRODUCCION-guia-locucion.md"; extra="out/$PRODUCCION-guia-locucion.md"; fi
          for a in $ADJUNTOS; do extra="$extra $a"; done
          gh release create "$etiqueta" \
            "out/$PRODUCCION.mp4" "out/$PRODUCCION-portada.jpg" "out/$PRODUCCION-escenas.jpg" \
            "out/$PRODUCCION-subtitulos.srt" $extra \
            --prerelease --target "$GITHUB_SHA" \
            --title "AGUA STUDIO · $PRODUCCION" \
            --notes "Render de \`$COMPOSICION\` (escala $ESCALA) desde \`$GITHUB_REF_NAME\` · commit $GITHUB_SHA. Música y efectos sintetizados por código. Voz: ${VOZ:-sin narración (subtítulos con tiempos estimados)}."
          echo "### MP4 publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$etiqueta" >> "$GITHUB_STEP_SUMMARY"
