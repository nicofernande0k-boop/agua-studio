# Publica en una Release archivos que ya están en el repositorio (videos renderizados localmente).
name: "AGUA STUDIO · Publicar archivos"
on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la Release"
        required: true
      titulo:
        description: "Título de la Release"
        required: true
      archivos:
        description: "Rutas del repositorio, separadas por espacios"
        required: true
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar el video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          for a in ${{ inputs.archivos }}; do
            case "$a" in *.mp4) ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact "$a" ;; esac
          done
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ inputs.etiqueta }}" --yes --cleanup-tag || true
          gh release create "${{ inputs.etiqueta }}" ${{ inputs.archivos }} --target "$GITHUB_SHA" --title "${{ inputs.titulo }}" --notes "Render local verificado. Commit $GITHUB_SHA."
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ inputs.etiqueta }}" >> "$GITHUB_STEP_SUMMARY"
